events {}

http {
    # Canary: đổi weight để chia traffic giữa model cũ (v1) và mới (v2)
    upstream vehicle_api {
        server api-v1:8000 weight=9;
        server api-v2:8000 weight=1;
    }

    server {
        listen 80;
        location / {
            proxy_pass http://vehicle_api;
            proxy_set_header Host $host;
        }
    }
}
