services:
  api-v1:
    build: .
    environment:
      MODEL_VERSION: v1
  api-v2:
    build: .
    environment:
      MODEL_VERSION: v2
  nginx:
    image: nginx:stable
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [api-v1, api-v2]
  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    depends_on: [prometheus]
